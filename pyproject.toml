[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "png2svg-cli"
version = "0.1.0"
description = "Convert PNG pixels into vector-only SVG paths"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.scripts]
png2svg = "png2svg.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["png2svg"]

[tool.mypy]
strict = true
packages = ["png2svg"]

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "ISC004", "PLR2004", "T201", "TC001", "TC003", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PT009", "PT027"]
